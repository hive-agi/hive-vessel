name: release

# Patch-bump and publish only when the push actually changes the library.
# README / CI / test-only commits do not mint a version, because a published
# pom is immutable on Clojars.
#
# CI owns VERSION: push the feature commit only and let this workflow pick
# the number (bump -> commit -> tag -> deploy). A hand-bumped VERSION gets
# bumped twice.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      # The suite gates the bump/deploy below, so a test-only change must be
      # able to trigger a run.
      - 'test/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A queued run's event sha can predate a release commit that landed
      # while it waited. Release the branch tip, never the event sha, and
      # skip when that tip is already a tagged release.
      - name: Sync to branch tip
        id: sync
        run: |
          git fetch --tags --force origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "skip: HEAD $(git rev-parse --short HEAD) is already released"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.sync.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.0
        if: steps.sync.outputs.skip != 'true'
        with:
          cli: latest

      - uses: actions/cache@v4
        if: steps.sync.outputs.skip != 'true'
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: m2-${{ runner.os }}-

      # Gate BEFORE the bump: a published pom is immutable, so a red suite
      # must not be able to mint a version, tag it and ship it. The editor
      # round-trips stay behind :integration; verify.yml covers the cljs half.
      - name: Test
        if: steps.sync.outputs.skip != 'true'
        run: clojure -M:test

      # Bump from max(VERSION, latest v* tag), so a tag minted by a run that
      # failed before committing VERSION is never reused.
      - name: Floor VERSION at the latest tag
        if: steps.sync.outputs.skip != 'true'
        run: |
          cur=$(tr -d '[:space:]' < VERSION)
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$cur" "$latest" | sort -V | tail -n1)" != "$cur" ]; then
            echo "VERSION $cur lags tag v$latest; bumping from $latest"
            printf '%s\n' "$latest" > VERSION
          fi

      - name: Bump patch version
        if: steps.sync.outputs.skip != 'true'
        run: |
          clojure -T:build bump :level :patch
          VER=$(tr -d '[:space:]' < VERSION)
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "::error::tag v$VER already exists; refusing to re-release it"
            exit 1
          fi

      # Runs AFTER the bump and BEFORE the tag, so the pending version
      # describes itself. A pinned hive-build without the task skips.
      - name: Regenerate changelog
        if: steps.sync.outputs.skip != 'true'
        run: |
          set +e
          out=$(clojure -T:build changelog 2>&1)
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            case "$out" in
              *"function not found: changelog"*)
                echo "skip: the pinned hive-build predates the changelog task" ;;
              *) exit "$status" ;;
            esac
          fi

      - name: Commit and tag
        if: steps.sync.outputs.skip != 'true'
        run: |
          VER=$(cat VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          git add VERSION
          [ -f CHANGELOG.md ] && git add CHANGELOG.md
          # [skip ci] stops this push from retriggering the workflow.
          git commit -m "chore(release): $VER [skip ci]"
          # Annotated: `git push --follow-tags` ignores lightweight tags,
          # which would publish the artifact and silently drop the tag.
          git tag -a "v$VER" -m "release $VER"
          # Atomic: branch and tag land together or neither does.
          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/v$VER"

      - name: Deploy
        if: steps.sync.outputs.skip != 'true'
        env:
          # The hive-agi org secret is CLOJARS_DEPLOY_TOKEN, while deps-deploy
          # reads CLOJARS_PASSWORD. Map one onto the other.
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
